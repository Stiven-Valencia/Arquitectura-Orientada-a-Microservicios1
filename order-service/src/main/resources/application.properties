# ---- Servicio de Pedidos ----
spring.application.name=order-service
server.port=8082

# URL base del microservicio de Usuarios.
# Se externaliza como propiedad para no acoplar el codigo a un host fijo:
# en Docker o en la nube basta con sobreescribirla por variable de entorno
# (USUARIOS_SERVICE_URL) sin recompilar nada.
usuarios.service.url=${USUARIOS_SERVICE_URL:http://localhost:8081}

# Tiempos de espera de la llamada REST entre servicios.
# Sin timeout, una caida del servicio de Usuarios dejaria colgados los hilos
# del servicio de Pedidos (fallo en cascada).
usuarios.service.timeout-conexion-ms=3000
usuarios.service.timeout-lectura-ms=3000

server.error.include-message=always
